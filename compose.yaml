services:
  db:
    build:
      context: ./postgres
    image: smart-expense-ai-postgres:16.15-alpine3.24-hardened
    environment:
      POSTGRES_USER: smart_expense_user
      POSTGRES_PASSWORD: smart_expense_password
      POSTGRES_DB: smart_expense_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_expense_user -d smart_expense_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: docker
      APP_DEBUG: "false"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_ORIGIN: http://localhost:5173
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql+psycopg://smart_expense_user:smart_expense_password@db:5432/smart_expense_ai
      JWT_SECRET: docker-development-only-change-me
      JWT_ALGORITHM: HS256
      JWT_ISSUER: smart-expense-ai
      JWT_AUDIENCE: smart-expense-ai-web
      ACCESS_TOKEN_MINUTES: 60
      AUTH_COOKIE_NAME: smart_expense_session
      AUTH_COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FINANCIAL_ASSISTANT_MODEL: ${FINANCIAL_ASSISTANT_MODEL:-gpt-5.6-terra}
      FINANCIAL_ASSISTANT_REASONING_EFFORT: ${FINANCIAL_ASSISTANT_REASONING_EFFORT:-low}
      FINANCIAL_ASSISTANT_MAX_TOOL_ROUNDS: ${FINANCIAL_ASSISTANT_MAX_TOOL_ROUNDS:-5}
      FINANCIAL_ASSISTANT_MAX_TOOL_CALLS: ${FINANCIAL_ASSISTANT_MAX_TOOL_CALLS:-12}
      FINANCIAL_ASSISTANT_MAX_OUTPUT_TOKENS: ${FINANCIAL_ASSISTANT_MAX_OUTPUT_TOKENS:-1600}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
