name: Financial benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Labelled benchmark integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate benchmark materialization
        run: python scripts/generate_benchmark_v1.py
      - name: Validate benchmark labels, hashes and split sizes
        run: python scripts/validate_benchmark.py
      - name: Verify deterministic regeneration
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmark.generator import write_dataset
          write_dataset(Path('/tmp/benchmark-v1-copy'))
          PY
          diff -r datasets/benchmark_v1 /tmp/benchmark-v1-copy --exclude README.md
      - name: Build historical evaluator payload
        run: python scripts/build_benchmark_payload.py
      - name: Run scenario-level development error analysis
        run: |
          python scripts/analyze_benchmark_errors.py \
            datasets/benchmark_v1 \
            --output /tmp/benchmark-errors.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/benchmark-errors.json').read_text())
          assert report['mode'] == 'development'
          assert report['scope']['phases'] == ['calibration', 'validation']
          assert report['holdout']['status'] == 'sealed'
          assert report['holdout']['range'] == {
              'startMonth': '2025-07',
              'endMonth': '2025-12',
          }
          historical = report['engines']['historical-v2.2']['tasks']
          rules = report['engines']['rules-v2']['tasks']
          assert set(historical) == {'recurrence', 'amount_anomaly'}
          assert set(rules) == {'recurrence', 'amount_anomaly', 'frequency_anomaly'}
          assert any(
              row['scenario'] == 'recurring_price_change'
              for row in historical['recurrence']['byScenario']
          )
          assert any(
              row['scenario'] == 'frequency_burst'
              for row in rules['frequency_anomaly']['byScenario']
          )

          print('Scenario diagnostic summary')
          for engine_name, engine in report['engines'].items():
              for task_name, task in engine['tasks'].items():
                  metrics = task['overall']
                  print(
                      f"{engine_name:16} {task_name:18} "
                      f"TP={metrics['truePositives']:3} FP={metrics['falsePositives']:3} "
                      f"FN={metrics['falseNegatives']:3} "
                      f"P={metrics['precision']:.4f} R={metrics['recall']:.4f} "
                      f"F1={metrics['f1']:.4f}"
                  )
          print('Top scenario error priorities')
          for row in report['priorityRanking'][:15]:
              print(
                  f"{row['engine']:16} {row['task']:18} {row['scenario']:32} "
                  f"TP={row['truePositives']:3} FP={row['falsePositives']:3} "
                  f"FN={row['falseNegatives']:3} cost={row['weightedErrorCost']}"
              )
          PY
      - name: Evaluate calibration and validation with holdout sealed
        run: |
          python scripts/evaluate_historical.py \
            datasets/benchmark_v1/historical_evaluation_payload.json \
            --mode development \
            --bootstrap-iterations 200 \
            --parameters-output /tmp/benchmark-parameters.json \
            --output /tmp/benchmark-development.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/benchmark-development.json').read_text())
          assert report['mode'] == 'development'
          assert report['holdout']['status'] == 'sealed'
          calibration = [fold['evaluateMonth'] for fold in report['calibration']['folds']]
          validation = [fold['evaluateMonth'] for fold in report['validation']['folds']]
          assert calibration == [f'2024-{month:02d}' for month in range(1, 13)]
          assert validation == [f'2025-{month:02d}' for month in range(1, 7)]
          assert not any(month >= '2025-07' for month in calibration + validation)
          assert report['calibration']['aggregate']['recurrence']['support'] > 0
          assert report['validation']['aggregate']['recurrence']['support'] > 0
          assert len(report['frozenParameters']['fingerprint']) == 64
          PY
