name: Financial benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Labelled benchmark integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate benchmark materialization
        run: python scripts/generate_benchmark_v1.py
      - name: Validate benchmark labels, hashes and split sizes
        run: python scripts/validate_benchmark.py
      - name: Verify deterministic regeneration
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmark.generator import write_dataset
          write_dataset(Path('/tmp/benchmark-v1-copy'))
          PY
          diff -r datasets/benchmark_v1 /tmp/benchmark-v1-copy --exclude README.md
      - name: Build historical evaluator payload
        run: python scripts/build_benchmark_payload.py
      - name: Run scenario-level development error analysis
        run: |
          python scripts/analyze_benchmark_errors.py \
            datasets/benchmark_v1 \
            --max-errors 500 \
            --output /tmp/benchmark-errors.json > /dev/null
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path('/tmp/benchmark-errors.json').read_text())
          assert report['mode'] == 'development'
          assert report['scope']['phases'] == ['calibration', 'validation']
          assert report['holdout']['status'] == 'sealed'
          assert report['holdout']['range'] == {
              'startMonth': '2025-07',
              'endMonth': '2025-12',
          }
          historical = report['engines']['historical-v2.2']['tasks']
          rules = report['engines']['rules-v2']['tasks']
          assert set(historical) == {'recurrence', 'amount_anomaly'}
          assert set(rules) == {'recurrence', 'amount_anomaly', 'frequency_anomaly'}

          def scenario(task, name):
              return next(row for row in task['byScenario'] if row['scenario'] == name)

          # Price-continuity acceptance contract. These assertions intentionally use only
          # calibration + validation and keep the 2025 H2 holdout sealed.
          for recurrence in (historical['recurrence'], rules['recurrence']):
              price_change = scenario(recurrence, 'recurring_price_change')
              assert (
                  price_change['truePositives'],
                  price_change['falsePositives'],
                  price_change['falseNegatives'],
              ) == (18, 0, 0)

              cancel_reactivate = scenario(recurrence, 'cancel_reactivate')
              assert cancel_reactivate['falsePositives'] == 0
              assert cancel_reactivate['falseNegatives'] == 9

              for name, expected_tp in (
                  ('equal_amount_temporal_streams', 36),
                  ('merchant_descriptor_drift', 18),
                  ('same_merchant_multi_stream', 36),
                  ('weekly_holiday_shift', 18),
              ):
                  row = scenario(recurrence, name)
                  assert (
                      row['truePositives'],
                      row['falsePositives'],
                      row['falseNegatives'],
                  ) == (expected_tp, 0, 0)

              quarterly = scenario(recurrence, 'quarterly_price_change')
              assert quarterly['truePositives'] == 6
              assert quarterly['falseNegatives'] == 0

          ordinary_historical = scenario(historical['recurrence'], 'ordinary_spend')
          ordinary_rules = scenario(rules['recurrence'], 'ordinary_spend')
          assert ordinary_historical['falsePositives'] <= 1
          assert ordinary_rules['falsePositives'] == 0

          print('Scenario diagnostic summary')
          for engine_name, engine in report['engines'].items():
              for task_name, task in engine['tasks'].items():
                  metrics = task['overall']
                  print(
                      f"{engine_name:16} {task_name:18} "
                      f"TP={metrics['truePositives']:3} FP={metrics['falsePositives']:3} "
                      f"FN={metrics['falseNegatives']:3} "
                      f"P={metrics['precision']:.4f} R={metrics['recall']:.4f} "
                      f"F1={metrics['f1']:.4f}"
                  )

          print('Scenario matrices')
          for engine_name, engine in report['engines'].items():
              for task_name, task in engine['tasks'].items():
                  print(f"[{engine_name} / {task_name}]")
                  for row in task['byScenario']:
                      print(
                          f"{row['scenario']:32} "
                          f"TP={row['truePositives']:3} FP={row['falsePositives']:3} "
                          f"FN={row['falseNegatives']:3} "
                          f"P={row['precision']:.4f} R={row['recall']:.4f} "
                          f"F1={row['f1']:.4f} cost={row['weightedErrorCost']}"
                      )

          print('Ordinary-spend recurrence FP slices')
          for engine_name, engine in report['engines'].items():
              recurrence = engine['tasks'].get('recurrence')
              if recurrence is None:
                  continue
              errors = [
                  item for item in recurrence['errors']
                  if item['type'] == 'FP' and item['scenario'] == 'ordinary_spend'
              ]
              cadence = Counter(item['detail'].get('cadence') or 'unknown' for item in errors)
              calendar = Counter(item['detail'].get('streamCalendar') or 'none' for item in errors)
              descriptors = Counter(
                  'descriptor' if item['detail'].get('streamDescriptor') else 'no-descriptor'
                  for item in errors
              )
              print(
                  f"{engine_name:16} count={len(errors):3} "
                  f"cadence={dict(cadence)} calendars={dict(calendar)} "
                  f"descriptor={dict(descriptors)}"
              )

          print('Top scenario error priorities')
          for row in report['priorityRanking'][:15]:
              print(
                  f"{row['engine']:16} {row['task']:18} {row['scenario']:32} "
                  f"TP={row['truePositives']:3} FP={row['falsePositives']:3} "
                  f"FN={row['falseNegatives']:3} cost={row['weightedErrorCost']}"
              )
          PY
      - name: Verify recurrence feature provenance
        run: |
          python scripts/diagnose_recurrence_fp_features.py \
            datasets/benchmark_v1 > /tmp/recurrence-features.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/recurrence-features.json').read_text())
          assert report['scope'] == ['calibration', 'validation']
          price_change = report['truePositivesByScenario']['recurring_price_change']
          assert price_change['count'] == 18
          assert price_change['streamBasis'] == {'merchant_price_continuity': 18}
          print(json.dumps(price_change, indent=2, sort_keys=True))
          PY
      - name: Evaluate calibration and validation with holdout sealed
        run: |
          python scripts/evaluate_historical.py \
            datasets/benchmark_v1/historical_evaluation_payload.json \
            --mode development \
            --bootstrap-iterations 200 \
            --parameters-output /tmp/benchmark-parameters.json \
            --output /tmp/benchmark-development.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/benchmark-development.json').read_text())
          assert report['mode'] == 'development'
          assert report['holdout']['status'] == 'sealed'
          calibration = [fold['evaluateMonth'] for fold in report['calibration']['folds']]
          validation = [fold['evaluateMonth'] for fold in report['validation']['folds']]
          assert calibration == [f'2024-{month:02d}' for month in range(1, 13)]
          assert validation == [f'2025-{month:02d}' for month in range(1, 7)]
          assert not any(month >= '2025-07' for month in calibration + validation)
          assert report['calibration']['aggregate']['recurrence']['support'] > 0
          assert report['validation']['aggregate']['recurrence']['support'] > 0
          assert len(report['frozenParameters']['fingerprint']) == 64
          PY
