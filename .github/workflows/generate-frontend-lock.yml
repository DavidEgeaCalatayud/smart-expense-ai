name: Generate frontend lockfile

on:
  push:
    branches: [feature/investment-portfolios]
    paths:
      - '.github/workflows/generate-frontend-lock.yml'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Regenerate lockfile only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact security floors
        working-directory: frontend
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/vitest']?.version!=='4.1.11') process.exit(1); if(p.packages['node_modules/source-map-js']?.version!=='1.2.2') process.exit(1); const t=p.packages['node_modules/tinypool']; if(t && t.version!=='2.1.2') process.exit(1)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regenerated-frontend-lock
          path: frontend/package-lock.json
          retention-days: 1
