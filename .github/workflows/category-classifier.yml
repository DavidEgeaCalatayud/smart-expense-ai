name: Category classifier benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: category-classifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  category-classifier:
    name: TF-IDF category classification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend and ML dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate deterministic labelled benchmark
        run: python scripts/generate_benchmark_v1.py
      - name: Run category classifier unit tests
        run: pytest tests/unit/test_category_classifier.py
      - name: Evaluate chronological, cold-start and calibration evidence
        run: |
          python scripts/evaluate_category_classifier.py \
            datasets/benchmark_v1 \
            --output /tmp/category-classifier-report.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/category-classifier-report.json').read_text())
          assert report['reportVersion'] == 'category-classifier-evaluation-v2'
          assert report['datasetVersion'] == 'financial-benchmark-v1'
          assert report['model']['version'] == 'tfidf-logreg-v1'
          assert report['model']['featureFields'] == ['merchant']
          assert report['model']['productConfidenceEnabled'] is False
          assert report['labelCoverage']['total'] == 2560
          assert set(report['labelCoverage']['byCategory']) == {
              'Food', 'Health', 'Other', 'Salary', 'Shopping', 'Subscriptions', 'Transport'
          }

          assert report['holdout']['status'] == 'sealed'
          assert report['holdout']['range'] == {
              'startMonth': '2025-07',
              'endMonth': '2025-12',
          }
          assert report['holdout']['usedForFit'] is False
          assert report['holdout']['usedForMetrics'] is False

          # Existing chronological regression floors remain unchanged.
          for split_name in ('calibration', 'validation'):
              split = report[split_name]
              metrics = split['metrics']
              assert metrics['macroF1'] >= 0.98
              assert metrics['accuracy'] >= 0.98
              assert split['merchantCoverage']['seen']['macroF1'] >= 0.99
              assert split['merchantCoverage']['unseen']['support'] > 0
              for category_metrics in split['perCategory'].values():
                  assert category_metrics['precision'] >= 0.95
                  assert category_metrics['recall'] >= 0.95

              labels = split['confusionMatrix']['labels']
              matrix = split['confusionMatrix']['matrix']
              assert set(labels) == set(split['perCategory'])
              assert len(matrix) == len(labels)
              assert all(len(row) == len(labels) for row in matrix)
              assert sum(sum(row) for row in matrix) == split['evaluationSamples']

          cold_start = report['merchantGroupHoldout']
          assert cold_start['policy'] == 'canonical_merchant_group_disjoint_v1'
          assert cold_start['merchantGroupOverlap'] == 0
          assert cold_start['evaluationMerchantGroups'] > 0
          assert cold_start['evaluationSamples'] >= 100

          calibration = report['calibrationAnalysis']
          assert calibration['productConfidenceEnabled'] is False
          assert set(calibration['methods']) == {'raw', 'platt', 'isotonic'}
          for method in calibration['methods'].values():
              assert method['brierScore'] >= 0
              assert 0 <= method['expectedCalibrationError'] <= 1
              assert len(method['reliabilityDiagram']) == 10
              assert sum(bin_['count'] for bin_ in method['reliabilityDiagram']) == calibration['evaluationSamples']

          print('Category classifier development report')
          print('Label coverage:', report['labelCoverage'])
          for split_name in ('calibration', 'validation'):
              split = report[split_name]
              print(f"\n[{split_name}]")
              print('fitSamples=', split['fitSamples'], 'evaluationSamples=', split['evaluationSamples'])
              print('metrics=', split['metrics'])
              print('merchantCoverage=', split['merchantCoverage'])
          print('\n[merchant-group holdout]')
          print('samples=', cold_start['evaluationSamples'])
          print('groups=', cold_start['evaluationMerchantGroups'])
          print('overlap=', cold_start['merchantGroupOverlap'])
          print('metrics=', cold_start['metrics'])
          print('\n[probability calibration diagnostics]')
          for name, metrics in calibration['methods'].items():
              print(name, 'brier=', metrics['brierScore'], 'ece=', metrics['expectedCalibrationError'])
          print('\nHoldout:', report['holdout'])
          PY
