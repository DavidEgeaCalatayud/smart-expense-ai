name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile quality
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      APP_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
      - name: Install mobile workspace dependencies
        run: npm install --workspace=@smart-expense-ai/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npm run dependencies:check --workspace=@smart-expense-ai/mobile
      - name: Run mobile unit tests
        run: npm run test --workspace=@smart-expense-ai/mobile
      - name: TypeScript check
        run: npm run typecheck --workspace=@smart-expense-ai/mobile
      - name: ESLint
        run: npm run lint --workspace=@smart-expense-ai/mobile
      - name: Bundle Android application
        run: npm run export:android --workspace=@smart-expense-ai/mobile
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate production-hardened Android project
        env:
          APP_ENV: production
        run: npm run prebuild:android --workspace=@smart-expense-ai/mobile
      - name: Verify generated Android privacy and transport policy
        run: |
          grep -q 'android:allowBackup="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'net.zetetic:sqlcipher-android' mobile/android/app/build.gradle || grep -R -q 'sqlcipher' mobile/android
      - name: Build native Android debug APK
        env:
          APP_ENV: production
        run: npm run native:android:debug --workspace=@smart-expense-ai/mobile
