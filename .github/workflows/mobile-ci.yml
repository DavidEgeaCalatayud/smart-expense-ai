name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile quality
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      APP_ENV: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
      - name: Reject backend/provider secret surface from mobile source
        run: |
          if grep -R -n -E '(OPENAI_API_KEY|DATABASE_URL|POSTGRES_PASSWORD|JWT_SECRET|SECRET_KEY)' mobile shared --exclude-dir=node_modules --exclude='*.md'; then
            echo 'Backend/provider secret identifiers must not be shipped in the mobile/shared source surface.' >&2
            exit 1
          fi
      - name: Install mobile workspace dependencies
        run: npm install --workspace=@smart-expense-ai/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npm run dependencies:check --workspace=@smart-expense-ai/mobile
      - name: Run mobile unit tests
        run: npm run test --workspace=@smart-expense-ai/mobile
      - name: TypeScript check
        run: npm run typecheck --workspace=@smart-expense-ai/mobile
      - name: ESLint
        run: npm run lint --workspace=@smart-expense-ai/mobile
      - name: Bundle Android application
        run: npm run export:android --workspace=@smart-expense-ai/mobile
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate production-hardened Android project
        env:
          APP_ENV: production
        run: npm run prebuild:android --workspace=@smart-expense-ai/mobile
      - name: Verify generated Android privacy and transport policy
        run: |
          manifest='mobile/android/app/src/main/AndroidManifest.xml'
          gradle_properties='mobile/android/gradle.properties'

          grep -q 'android:allowBackup="false"' "$manifest" || {
            echo 'Generated Android manifest must disable Auto Backup.' >&2
            grep -n 'allowBackup' "$manifest" || true
            exit 1
          }

          grep -q 'android:usesCleartextTraffic="false"' "$manifest" || {
            echo 'Production Android manifest must disable cleartext traffic.' >&2
            grep -n 'usesCleartextTraffic' "$manifest" || true
            exit 1
          }

          grep -q '^expo\.sqlite\.useSQLCipher=true$' "$gradle_properties" || {
            echo 'Expo SQLite prebuild must enable SQLCipher through expo.sqlite.useSQLCipher=true.' >&2
            grep -n 'expo\.sqlite' "$gradle_properties" || true
            exit 1
          }
      - name: Build native Android debug APK
        env:
          APP_ENV: production
        run: npm run native:android:debug --workspace=@smart-expense-ai/mobile
