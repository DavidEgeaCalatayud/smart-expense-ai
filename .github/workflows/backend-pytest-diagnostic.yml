name: Backend pytest diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JWT_SECRET: ci-only-smart-expense-secret-not-for-production
  JWT_ALGORITHM: HS256
  JWT_ISSUER: smart-expense-ai
  JWT_AUDIENCE: smart-expense-ai-web
  ACCESS_TOKEN_MINUTES: 60
  AUTH_COOKIE_NAME: smart_expense_session
  AUTH_COOKIE_SECURE: "false"
  FRONTEND_ORIGIN: http://localhost:5173
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver

concurrency:
  group: backend-pytest-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-diagnostic:
    name: Backend pytest diagnostic
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_expense_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_expense_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply migrations to a clean PostgreSQL database
        run: alembic upgrade head
      - name: Verify FastAPI imports
        run: python -c "from app.main import app; from app.version import APP_VERSION; assert app.title == 'Smart Expense AI API'; assert app.version == APP_VERSION"
      - name: Run backend tests and capture traceback
        shell: bash
        run: |
          set -o pipefail
          pytest 2>&1 | tee backend-pytest.log
      - name: Upload backend pytest log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-pytest-log
          path: backend/backend-pytest.log
          if-no-files-found: error
          retention-days: 1
