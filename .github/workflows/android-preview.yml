name: Installable Android preview

on:
  workflow_dispatch:
  push:
    branches: ['android-preview/**']

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and verify standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      APP_ENV: preview
      ANDROID_STANDALONE_PREVIEW: '1'
      EXPO_PUBLIC_API_BASE_URL: https://smart-expense-free.onrender.com
      EXPO_PUBLIC_E2E_MODE: ''
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        run: npm install --workspace=@smart-expense-ai/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Verify distribution configuration
        run: |
          npm run dependencies:check --workspace=@smart-expense-ai/mobile
          npm run test --workspace=@smart-expense-ai/mobile -- --runTestsByPath __tests__/appConfig.test.ts
          npm run typecheck --workspace=@smart-expense-ai/mobile
          bash -n scripts/build-android-preview.sh scripts/smoke-android-preview.sh
      - name: Build, sign and inspect the preview APK
        run: bash scripts/build-android-preview.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch signed release without Metro
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/smoke-android-preview.sh
      - name: Save the verified APK and public build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-expense-ai-preview
          path: dist/android-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Save failed launch diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-diagnostics
          path: |
            dist/android-preview/launch.xml
            dist/android-preview/launch-failure.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish preview download
    needs: apk
    if: startsWith(github.ref, 'refs/heads/android-preview/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smart-expense-ai-preview
          path: preview
      - name: Publish APK as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: android-preview-${{ github.run_id }}
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          APK de prueba de Smart Expense AI conectado a https://smart-expense-free.onrender.com.

          Descarga `smart-expense-ai-preview.apk` en Android y ábrelo para instalarlo. Usa tu cuenta de la web. El APK incluye JavaScript y funciona sin Expo Go ni Metro.

          Esta edición usa el paquete separado `com.davidegea.smartexpenseai.preview` y una clave de firma temporal. No es la versión de Google Play. Una futura preview requerirá desinstalar esta edición: sincroniza antes todos los cambios pendientes. La futura aplicación oficial tendrá su propia firma permanente y recuperará los datos sincronizados al iniciar sesión.

          Se verificaron la firma, el servidor incluido, HTTPS y el inicio de la pantalla de acceso en un emulador con el APK firmado. Quedan pendientes las pruebas en un dispositivo físico y los requisitos de publicación en Google Play. `build-info.json` conserva la revisión, la huella del APK y el certificado.
          NOTES
          gh release create "$PREVIEW_TAG" \
            preview/smart-expense-ai-preview.apk \
            preview/smart-expense-ai-preview.apk.sha256 \
            preview/build-info.json \
            --target "$PREVIEW_SHA" --prerelease --latest=false \
            --title "Smart Expense AI — APK de prueba ($PREVIEW_TAG)" \
            --notes-file "$RUNNER_TEMP/preview-notes.md"
