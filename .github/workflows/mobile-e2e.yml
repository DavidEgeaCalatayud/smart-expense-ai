name: Android Native E2E

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'shared/**'
      - 'scripts/run-mobile-native-e2e.sh'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'shared/**'
      - 'scripts/run-mobile-native-e2e.sh'
      - '.github/workflows/mobile-e2e.yml'

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Android emulator E2E
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_mobile_e2e
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_mobile_e2e
      JWT_SECRET: ci-only-mobile-e2e-secret-not-for-production-2026
      JWT_ALGORITHM: HS256
      JWT_ISSUER: smart-expense-ai
      JWT_AUDIENCE: smart-expense-ai-web
      ACCESS_TOKEN_MINUTES: 60
      AUTH_COOKIE_NAME: smart_expense_session
      AUTH_COOKIE_SECURE: 'false'
      FRONTEND_ORIGIN: http://localhost:5173
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,10.0.2.2
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:8000
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_QR_CODE: '1'
      EXPO_NO_TYPESCRIPT_SETUP: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_expense_ai_mobile_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_expense_ai_mobile_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install mobile workspace dependencies
        run: npm install --workspace=@smart-expense-ai/mobile --include-workspace-root=false --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npm run dependencies:check --workspace=@smart-expense-ai/mobile
      - name: Generate Android native project for emulator E2E
        env:
          APP_ENV: development
        run: npm run prebuild:android --workspace=@smart-expense-ai/mobile
      - name: Build native Android debug APK
        env:
          APP_ENV: development
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: npm run native:android:debug --workspace=@smart-expense-ai/mobile

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_ZIP_SHA256: a4ccab6b604617e7aef6db4f885666056eabe5cfa32befaa3bc994041b8fcbb5
        run: |
          curl --fail --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.7.0/maestro.zip \
            --output "$RUNNER_TEMP/maestro.zip"
          echo "$MAESTRO_ZIP_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/maestro"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          MAESTRO_BIN="$(find "$RUNNER_TEMP/maestro" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$MAESTRO_BIN"
          chmod +x "$MAESTRO_BIN"
          echo "$(dirname "$MAESTRO_BIN")" >> "$GITHUB_PATH"

      - name: Start FastAPI and Metro
        run: |
          set -euo pipefail

          (
            cd backend
            nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
              > "$RUNNER_TEMP/mobile-e2e-backend.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/mobile-e2e-backend.pid"
          )
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:8000/health > /dev/null; then
            echo 'FastAPI failed to become ready:' >&2
            cat "$RUNNER_TEMP/mobile-e2e-backend.log" >&2 || true
            exit 1
          fi

          start_metro() {
            (
              cd mobile
              nohup setsid npx expo start --localhost --port 8081 \
                >> "$RUNNER_TEMP/mobile-e2e-metro.log" 2>&1 &
              echo $! > "$RUNNER_TEMP/mobile-e2e-metro.pid"
            )
          }

          stop_metro() {
            if [[ -f "$RUNNER_TEMP/mobile-e2e-metro.pid" ]]; then
              metro_pid="$(cat "$RUNNER_TEMP/mobile-e2e-metro.pid")"
              kill -- "-$metro_pid" 2>/dev/null || kill "$metro_pid" 2>/dev/null || true
              sleep 2
            fi
          }

          metro_ready() {
            curl --fail --silent --max-time 2 \
              'http://127.0.0.1:8081/_expo/open?platform=android' > /dev/null
          }

          wait_for_metro() {
            for attempt in $(seq 1 45); do
              if metro_ready; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          : > "$RUNNER_TEMP/mobile-e2e-metro.log"
          start_metro
          if ! wait_for_metro; then
            if grep -q 'React Native DevTools-linux-x64/chrome-sandbox' "$RUNNER_TEMP/mobile-e2e-metro.log"; then
              echo 'Repairing React Native DevTools Chromium sandbox permissions for the ephemeral CI runner.'
              stop_metro
              sandbox_count=0
              while IFS= read -r sandbox_path; do
                [[ -n "$sandbox_path" ]] || continue
                sudo chown root:root "$sandbox_path"
                sudo chmod 4755 "$sandbox_path"
                sandbox_count=$((sandbox_count + 1))
              done < <(find "$HOME/.cache/dotslash" -type f \
                -path '*/React Native DevTools-linux-x64/chrome-sandbox' -print 2>/dev/null || true)
              if [[ "$sandbox_count" -eq 0 ]]; then
                echo 'React Native DevTools reported a Chromium sandbox failure, but its sandbox binary was not found.' >&2
                cat "$RUNNER_TEMP/mobile-e2e-metro.log" >&2 || true
                exit 1
              fi
              echo '--- restarting Metro after sandbox repair ---' >> "$RUNNER_TEMP/mobile-e2e-metro.log"
              start_metro
            fi
          fi

          if ! wait_for_metro; then
            echo 'Metro failed to become ready:' >&2
            cat "$RUNNER_TEMP/mobile-e2e-metro.log" >&2 || true
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android native E2E
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/run-mobile-native-e2e.sh

      - name: Upload native E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-native-e2e-diagnostics
          path: |
            ${{ runner.temp }}/mobile-e2e-backend.log
            ${{ runner.temp }}/mobile-e2e-metro.log
            ${{ runner.temp }}/maestro-results
          if-no-files-found: ignore
          retention-days: 7
