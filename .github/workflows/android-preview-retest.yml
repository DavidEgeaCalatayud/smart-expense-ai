name: Verify retained Android preview

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Installable Android preview run retaining an APK and build metadata
        required: true
        type: string
  push:
    branches: ['android-preview-retest/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: android-preview-retest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and launch retained APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve and validate the original build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.source_run }}
        run: |
          source_run="${INPUT_RUN:-${GITHUB_REF_NAME#android-preview-retest/}}"
          [[ "$source_run" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$source_run" > "$RUNNER_TEMP/source-run.json"
          python - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json, os, re, sys
          run = json.load(open(sys.argv[1]))
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/android-preview.yml'
          assert run['status'] == 'completed'
          assert run['head_branch'].startswith('android-preview/')
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={run['id']}\nsource_sha={run['head_sha']}\n")
          PY
      - name: Recover the exact signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unverified-preview-build
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/android-preview
      - name: Recover the original public build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-diagnostics
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/android-preview
      - name: Recheck integrity, signature and application configuration
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- mobile shared package.json scripts/build-android-preview.sh
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('dist/android-preview')
          info = json.loads((root / 'build-info.json').read_text())
          assert info['sourceSha'] == os.environ['SOURCE_SHA']
          assert str(info['workflowRun']) == os.environ['SOURCE_RUN']
          assert info['apkSha256'] == hashlib.sha256((root / 'smart-expense-ai-preview.apk').read_bytes()).hexdigest()
          assert re.fullmatch(r'[0-9a-f]{64}', info['signerCertificateSha256'])
          with open(os.environ['RUNNER_TEMP'] + '/preview-certificate', 'w') as output:
              output.write(info['signerCertificateSha256'])
          PY
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk=dist/android-preview/smart-expense-ai-preview.apk
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee dist/android-preview/signature.txt
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt" dump badging "$apk" > dist/android-preview/apk-metadata.txt
          "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/preview-manifest.txt"
          PREVIEW_CERT_SHA256="$(cat "$RUNNER_TEMP/preview-certificate")" \
            PREVIEW_MANIFEST_PATH="$RUNNER_TEMP/preview-manifest.txt" \
            GITHUB_SHA="$SOURCE_SHA" GITHUB_RUN_ID="$SOURCE_RUN" \
            python scripts/verify-android-preview.py
          (cd dist/android-preview && sha256sum smart-expense-ai-preview.apk > smart-expense-ai-preview.apk.sha256)
          rm -f dist/android-preview/launch.xml dist/android-preview/launch-failure.log
          bash -n scripts/smoke-android-preview.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the same signed release without Metro
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/smoke-android-preview.sh
      - name: Retain verified APK and acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-expense-ai-preview
          path: dist/android-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Retain diagnostics if acceptance fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-retest-diagnostics
          path: |
            dist/android-preview/*.json
            dist/android-preview/*.txt
            dist/android-preview/*.xml
            dist/android-preview/*.png
            dist/android-preview/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified preview download
    needs: verify
    if: startsWith(github.ref, 'refs/heads/android-preview-retest/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smart-expense-ai-preview
          path: preview
      - name: Publish the accepted original APK as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_TAG: android-preview-${{ github.run_id }}
          PREVIEW_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          APK de prueba de Smart Expense AI conectado a https://smart-expense-free.onrender.com.

          Descarga `smart-expense-ai-preview.apk` en Android y ábrelo para instalarlo. Usa tu cuenta de la web. Incluye JavaScript y funciona sin Expo Go ni Metro.

          Esta edición usa el paquete separado `com.davidegea.smartexpenseai.preview` y una clave temporal. Una futura preview requerirá desinstalar esta edición: sincroniza antes todos los cambios pendientes. La aplicación oficial de Google Play tendrá su propia firma permanente y recuperará los datos sincronizados al iniciar sesión.

          Se verificaron la firma, el servidor HTTPS incluido y la pantalla de acceso con este mismo APK firmado en un emulador Android 35. Quedan pendientes las pruebas en un dispositivo físico y la publicación en Google Play. `build-info.json` distingue la revisión de compilación de la revisión que ejecutó la aceptación; se conserva el APK original sin recompilar ni cambiar su firma.
          NOTES
          gh release create "$PREVIEW_TAG" \
            preview/smart-expense-ai-preview.apk \
            preview/smart-expense-ai-preview.apk.sha256 \
            preview/build-info.json \
            --target "$PREVIEW_SHA" --prerelease --latest=false \
            --title 'Smart Expense AI 0.2.0 — APK de prueba' \
            --notes-file "$RUNNER_TEMP/preview-notes.md"
