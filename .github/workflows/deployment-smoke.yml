name: Deployed HTTPS smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only live backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check public ingress and protected routes
        run: python scripts/check-live-backend.py --base-url https://smart-expense-free.onrender.com --output dist/deployment-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-${{ github.run_id }}
          path: dist/deployment-smoke.json
          retention-days: 14
