name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JWT_SECRET: ci-only-smart-expense-secret-not-for-production
  JWT_ALGORITHM: HS256
  JWT_ISSUER: smart-expense-ai
  JWT_AUDIENCE: smart-expense-ai-web
  ACCESS_TOKEN_MINUTES: 60
  AUTH_COOKIE_NAME: smart_expense_session
  AUTH_COOKIE_SECURE: "false"
  FRONTEND_ORIGIN: http://localhost:5173
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_expense_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_expense_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply migrations to a clean PostgreSQL database
        run: alembic upgrade head
      - name: Verify FastAPI imports
        run: python -c "from app.main import app; assert app.title == 'Smart Expense AI API'; assert app.version == '1.2.0'"
      - name: Run backend tests
        run: pytest
      - name: Run historical-v2.2 walk-forward evaluation fixture
        run: |
          python scripts/evaluate_historical.py evaluation/historical_v2_fixture.json --output /tmp/historical-v2-report.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/historical-v2-report.json').read_text())
          assert report['analysisVersion'] == 'historical-v2.2'
          assert report['validationStrategy'] == 'walk_forward_monthly_fold_local_identity'
          assert report['labelStrategy'] == 'temporal_recurring_streams_with_calendar_signature'
          assert len(report['folds']) == 4
          assert 'identitySourceTransactions' in report['folds'][0]
          assert all(fold['temporalPhaseProfiles'] >= 2 for fold in report['folds'])
          assert 'precision' in report['aggregate']['recurrence']
          assert 'falsePositivesPer100Transactions' in report['aggregate']['anomalies']
          PY
      - name: Run sealed split protocol and confidence fixture
        run: |
          python scripts/evaluate_historical.py \
            evaluation/historical_v2_fixture.json \
            --mode development \
            --bootstrap-iterations 200 \
            --parameters-output /tmp/historical-parameters.json \
            --output /tmp/historical-development.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/historical-development.json').read_text())
          assert report['mode'] == 'development'
          assert report['holdout']['status'] == 'sealed'
          assert [fold['evaluateMonth'] for fold in report['calibration']['folds']] == ['2026-07']
          assert [fold['evaluateMonth'] for fold in report['validation']['folds']] == ['2026-08', '2026-09']
          confidence = report['validation']['aggregate']['recurrence']['confidence']
          assert confidence['method'] == 'month_block_percentile_bootstrap_v1'
          assert confidence['level'] == 0.95
          assert confidence['iterations'] == 200
          assert confidence['blocks'] == 2
          assert report['validation']['aggregate']['recurrence']['support'] == confidence['support']
          assert len(report['frozenParameters']['fingerprint']) == 64
          PY
          python scripts/evaluate_historical.py \
            evaluation/historical_v2_fixture.json \
            --mode holdout \
            --bootstrap-iterations 200 \
            --parameters /tmp/historical-parameters.json \
            --output /tmp/historical-holdout.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          development = json.loads(Path('/tmp/historical-development.json').read_text())
          holdout = json.loads(Path('/tmp/historical-holdout.json').read_text())
          assert holdout['mode'] == 'holdout'
          assert [fold['evaluateMonth'] for fold in holdout['holdout']['folds']] == ['2026-10']
          assert holdout['frozenParameters']['fingerprint'] == development['frozenParameters']['fingerprint']
          assert holdout['holdout']['aggregate']['recurrence']['confidence']['blocks'] == 1
          PY

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run component tests
        run: npm run test
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit Python runtime dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependency tree
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    name: Critical E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smart_expense_ai_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_expense_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_expense_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Apply migrations for E2E
        working-directory: backend
        run: alembic upgrade head
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run critical E2E flow
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build Compose images
        run: docker compose build
      - name: Start full stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verify versioned API contract through Nginx
        run: |
          curl --fail --silent --show-error -D frontend-headers.txt http://localhost:5173/ -o /dev/null
          grep -i '^Content-Security-Policy:' frontend-headers.txt
          grep -i '^X-Content-Type-Options: nosniff' frontend-headers.txt
          curl --fail --silent --show-error http://localhost:5173/health | grep '"status":"ok"'
          curl --fail --silent --show-error \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"email":"docker-ci@example.com","password":"docker-test-password","displayName":"Docker CI"}' \
            http://localhost:5173/api/v1/auth/register | grep 'docker-ci@example.com'
          curl --fail --silent --show-error -D api-headers.txt -b cookies.txt http://localhost:5173/api/v1/categories -o categories.json
          grep 'Food' categories.json
          grep -i '^Cache-Control: no-store' api-headers.txt
          curl --fail --silent --show-error -b cookies.txt 'http://localhost:5173/api/v1/transactions?page=1&pageSize=10' -o transactions.json
          grep '"pageSize":10' transactions.json
          grep '"items":\[\]' transactions.json
          curl --fail --silent --show-error -b cookies.txt http://localhost:5173/api/v1/analytics/summary -o summary.json
          grep '"transactionCount":0' summary.json
          curl --fail --silent --show-error -X POST -b cookies.txt http://localhost:5173/api/v1/intelligence/scan -o intelligence-scan.json
          grep '"analyzedTransactions":0' intelligence-scan.json
          grep '"detectedFindings":0' intelligence-scan.json
          curl --fail --silent --show-error -b cookies.txt http://localhost:5173/api/v1/intelligence/summary -o intelligence-summary.json
          grep '"openCount":0' intelligence-summary.json
          grep '"ruleVersion":"rules-v1"' intelligence-summary.json
          curl --fail --silent --show-error \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"merchant":"Decimal A","description":"fixed point smoke","category":"Food","amount":"0.10","date":"2026-08-24","type":"expense","paymentMethod":"card","isRecurring":false}' \
            http://localhost:5173/api/v2/transactions -o decimal-a.json
          grep '"amount":"0.10"' decimal-a.json
          curl --fail --silent --show-error \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"merchant":"Decimal B","description":"fixed point smoke","category":"Food","amount":"0.20","date":"2026-08-24","type":"expense","paymentMethod":"card","isRecurring":false}' \
            http://localhost:5173/api/v2/transactions -o decimal-b.json
          grep '"amount":"0.20"' decimal-b.json
          curl --fail --silent --show-error -b cookies.txt http://localhost:5173/api/v2/analytics/summary -o decimal-summary.json
          grep '"totalExpenses":"0.30"' decimal-summary.json
          grep '"balance":"-0.30"' decimal-summary.json
          curl --fail --silent --show-error -X POST -b cookies.txt \
            'http://localhost:5173/api/v2/intelligence/historical-analysis?months=6' -o historical-analysis.json
          grep '"analysisVersion":"historical-v2.2"' historical-analysis.json
          grep '"analyzedTransactions":2' historical-analysis.json
          grep '"direction":"insufficient_data"' historical-analysis.json
          grep '"strategy":"exclude_partial"' historical-analysis.json
          grep '"partialMonth":"2026-08"' historical-analysis.json
          grep '"strategy":"canonical_merchant_then_descriptor_amount_then_temporal_phase"' historical-analysis.json
          grep '"ambiguityPolicy":"split_only_with_repeated_concurrent_calendar_evidence"' historical-analysis.json
          curl --fail --silent --show-error -b cookies.txt \
            http://localhost:5173/api/v2/intelligence/historical-analysis/latest -o historical-latest.json
          grep '"analysisVersion":"historical-v2.2"' historical-latest.json
          test "$(curl --silent --output decimal-number.json --write-out '%{http_code}' \
            -b cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"merchant":"Binary Float","description":"must fail","category":"Food","amount":0.1,"date":"2026-08-24","type":"expense","paymentMethod":"card","isRecurring":false}' \
            http://localhost:5173/api/v2/transactions)" = "422"
          grep '"code":"validation_error"' decimal-number.json
          test "$(curl --silent --output legacy.json --write-out '%{http_code}' http://localhost:5173/api/transactions)" = "404"
          grep '"code":"http_404"' legacy.json
          test "$(curl --silent --output unauth.json --write-out '%{http_code}' http://localhost:5173/api/v1/intelligence/findings)" = "401"
          grep '"requestId"' unauth.json
      - name: Verify authentication rate limiting
        run: |
          for attempt in 1 2 3 4 5; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d '{"email":"nobody@example.com","password":"definitely-wrong"}' \
              http://localhost:5173/api/v1/auth/login)" = "401"
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"nobody@example.com","password":"definitely-wrong"}' \
            http://localhost:5173/api/v1/auth/login)" = "429"
      - name: Show Compose status
        if: always()
        run: docker compose ps
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, security, e2e, docker]
    steps:
      - name: Require every quality job to pass
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.docker.result }}" = "success"