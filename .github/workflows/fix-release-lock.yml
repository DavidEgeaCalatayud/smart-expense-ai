name: Temporary release lock repair

on:
  push:
    branches:
      - release/v1-readiness
    paths:
      - .github/workflows/fix-release-lock.yml

permissions:
  contents: write

jobs:
  repair-lock:
    name: Repair frontend audit lock
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1-readiness
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0

      - name: Repair only the frontend lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify patched brace-expansion versions
        working-directory: frontend
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const top = packages['node_modules/brace-expansion']?.version;
          const nested = packages['node_modules/@typescript-eslint/typescript-estree/node_modules/brace-expansion']?.version;
          if (top !== '1.1.21') throw new Error(`Expected top-level brace-expansion 1.1.21, got ${top}`);
          if (nested !== '5.0.12') throw new Error(`Expected nested brace-expansion 5.0.12, got ${nested}`);
          NODE

      - name: Verify frozen install and high audit gate
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

      - name: Refuse unrelated source changes
        run: |
          test -z "$(git diff --name-only -- frontend/package.json)"
          changed="$(git diff --name-only)"
          test "$changed" = "frontend/package-lock.json"

      - name: Commit repaired lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'fix(frontend): refresh patched audit dependencies'
          git push origin HEAD:release/v1-readiness
