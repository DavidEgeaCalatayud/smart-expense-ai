name: Lifecycle diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lifecycle-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-reactivate:
    name: Cancel-reactivate development diagnostic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generate deterministic benchmark
        run: python scripts/generate_benchmark_v1.py
      - name: Diagnose cancel/reactivate lifecycle
        run: |
          python scripts/diagnose_cancel_reactivate.py \
            datasets/benchmark_v1 > /tmp/cancel-reactivate.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cancel-reactivate.json').read_text())
          assert report['scope'] == ['calibration', 'validation']
          assert report['holdout']['status'] == 'sealed'
          print('month active matched base continuity v22 profiles')
          for row in report['evaluationMonths']:
              print(
                  row['month'],
                  f"active={row['labelActive']}",
                  f"matched={row['matched']}",
                  f"base={len(row['baseStreams'])}",
                  f"continuity={[(item['relinked'], item['sourceStreamCount'], item['canonicalVariantCount']) for item in row['continuity']]}",
                  f"v22={[(item['basis'], len(item['transactions'])) for item in row['v22Streams']]}",
                  f"profiles={[(item['streamBasis'], item['cadence'], item['occurrenceCount'], item['missedExpectedOccurrences']) for item in row['profiles']]}",
              )
          active = [row for row in report['evaluationMonths'] if row['labelActive']]
          dormant = [row for row in report['evaluationMonths'] if not row['labelActive']]
          print('active matched', sum(row['matched'] for row in active), '/', len(active))
          print('dormant matched', sum(row['matched'] for row in dormant), '/', len(dormant))
          PY
