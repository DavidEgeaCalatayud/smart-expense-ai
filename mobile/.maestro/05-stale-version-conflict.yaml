appId: com.davidegea.smartexpenseai
---
# Flow 04 leaves the already-loaded app on the transactions screen with local V1 and airplane mode
# enabled. The host then advances the server to V2 while the client cannot synchronize. Edit V1
# locally, restore connectivity, and require the real stale_version conflict path.
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
- scrollUntilVisible:
    element: "Offline Coffee"
    direction: DOWN
    timeout: 15000
- assertVisible: "Offline Coffee"
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Edit transaction"
    direction: UP
    timeout: 10000
- assertVisible: "Edit transaction"
- tapOn: "Merchant"
- eraseText: 50
- inputText: "Local Coffee"
- hideKeyboard
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
    timeout: 10000
- tapOn: "Save changes"
- extendedWaitUntil:
    visible: "Local Coffee"
    timeout: 15000
- scrollUntilVisible:
    element: "Pending sync"
    direction: DOWN
    timeout: 15000
- assertVisible: "Pending sync"
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "Online"
    timeout: 30000
- scrollUntilVisible:
    element: "Conflicts need a decision"
    direction: UP
    timeout: 30000
- assertVisible: "This transaction changed on another device."
- assertVisible: "Use server"
- assertVisible: "Retry mine"
- tapOn: "Use server"
- scrollUntilVisible:
    element: "Server Coffee"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element: "Synced"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element: "Online"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "All changes synchronized"
    timeout: 15000
- assertNotVisible: "Conflicts need a decision"
