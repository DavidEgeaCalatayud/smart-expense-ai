appId: com.davidegea.smartexpenseai
---
- tapOn:
    id: "tab-mi-dinero"
- extendedWaitUntil:
    visible: "Mi dinero"
    timeout: 15000

# Start from the state established by 20-money-workspace:
# Trade Republic 1,000 EUR + Bankinter 200 EUR = 1,200 EUR.
- scrollUntilVisible:
    element: "Trade Republic"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element: "Corriente · Bankinter"
    direction: DOWN
    timeout: 10000
    centerElement: true

# Account cards are rendered in creation order. The action labels repeat once per card, so use
# their explicit occurrence instead of viewport position or React Native relational selectors.
- tapOn:
    text: "Actualizar saldo"
    index: 1
- extendedWaitUntil:
    visible: "Actualizar saldo"
    timeout: 10000
- assertVisible: "Bankinter · actual 200,00 €"
- tapOn: "Nuevo saldo"
- eraseText
- inputText: "250.00"
- hideKeyboard
- tapOn: "Guardar nuevo saldo"
- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "1.250,00 €"
    timeout: 15000

- scrollUntilVisible:
    element: "Corriente · Bankinter"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    text: "Editar"
    index: 1
# The account form preserves the list scroll offset. Reveal its heading before asserting the form
# is open; otherwise the edit can succeed while "Editar cuenta" remains above the viewport.
- scrollUntilVisible:
    element: "Editar cuenta"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "Editar cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Nombre de la cuenta"
    direction: DOWN
    timeout: 10000
- tapOn: "Nombre de cuenta"
- eraseText
- inputText: "Bankinter Principal"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
    centerElement: true
# The label is centered by the previous command. Tap the switch at the right edge of the same row
# instead of matching a generic checked node from the Android accessibility tree.
- tapOn:
    point: "90%,50%"
- scrollUntilVisible:
    element: "Guardar cambios"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "money-account-submit"
- extendedWaitUntil:
    visible: "Bankinter Principal"
    timeout: 15000
- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "1.000,00 €"
    timeout: 15000

- scrollUntilVisible:
    element: "Bankinter Principal"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    text: "Editar"
    index: 1
# The account form preserves the list scroll offset. The edit action can open correctly with the
# heading just above the viewport, so reveal it before asserting that the form is open.
- scrollUntilVisible:
    element: "Editar cuenta"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "Editar cuenta"
    timeout: 10000
# Position the bottom of the form with a stable submit selector. On this re-enable path Maestro can
# render the switch fully while failing to satisfy centerElement for its label near the scroll limit.
- scrollUntilVisible:
    element: "Guardar cambios"
    direction: DOWN
    timeout: 10000
    centerElement: true
# In this form state the Android hierarchy contains exactly one checked=true node: the net-worth
# switch. The following 1,250 EUR assertion remains the semantic proof that it was re-enabled.
- tapOn:
    checked: true
- tapOn:
    id: "money-account-submit"
- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "1.250,00 €"
    timeout: 15000

- tapOn: "Cuenta"
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Bankinter"
- hideKeyboard
- tapOn:
    id: "bank-institution-bankinter"
- scrollUntilVisible:
    element: "Nombre de la cuenta"
    direction: DOWN
    timeout: 10000
- tapOn: "Nombre de cuenta"
- eraseText
- inputText: "Bankinter Ahorro"
- hideKeyboard
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Saldo actual"
    index: 1
- inputText: "50.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
    centerElement: true
- scrollUntilVisible:
    element: "Añadir cuenta"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "money-account-submit"
- extendedWaitUntil:
    visible: "Bankinter Ahorro"
    timeout: 15000

- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "3 activas"
    timeout: 15000
- assertVisible: "1.300,00 €"

- scrollUntilVisible:
    element: "Bankinter Ahorro"
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    text: "Archivar"
    index: 2
- extendedWaitUntil:
    visible: "¿Archivar cuenta?"
    timeout: 10000
- tapOn: "Archivar"
- extendedWaitUntil:
    notVisible: "Bankinter Ahorro"
    timeout: 15000
- scrollUntilVisible:
    element: "Trade Republic"
    direction: UP
    timeout: 10000
- assertVisible: "Trade Republic"
- scrollUntilVisible:
    element: "Bankinter Principal"
    direction: DOWN
    timeout: 10000
- assertVisible: "Bankinter Principal"

- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "2 activas"
    timeout: 15000
- assertVisible: "1.250,00 €"

- scrollUntilVisible:
    element: "Trade Republic"
    direction: DOWN
    timeout: 10000
# The card title can be visible while the lower purpose row is still below the viewport. Scroll to
# the purpose itself so the broker invariant is asserted against a rendered accessibility node.
- scrollUntilVisible:
    element: "Inversión"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Inversión"
- scrollUntilVisible:
    element: "Evolución del patrimonio"
    direction: DOWN
    timeout: 10000
- assertVisible: "Últimos 12 meses · snapshots manuales"

# Return to Activity only after the complete money lifecycle has passed; the cross-client bridge
# starts after this flow and therefore cannot hide a partial Mi dinero run.
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
