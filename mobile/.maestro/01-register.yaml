appId: com.davidegea.smartexpenseai
---
- launchApp
- extendedWaitUntil:
    visible: "Bienvenido de nuevo"
    timeout: 60000
- tapOn: "Crear una"
- assertVisible: "Crear cuenta"
- tapOn: "Display name"
- inputText: "Mobile E2E"
- tapOn: "Email"
- inputText: ${E2E_EMAIL_A}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Submit create account"
- extendedWaitUntil:
    visible: "Mi dinero"
    timeout: 20000
- assertVisible: "PATRIMONIO TOTAL"
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Tus movimientos"
    timeout: 30000
- runFlow: 20-money-workspace.yaml
