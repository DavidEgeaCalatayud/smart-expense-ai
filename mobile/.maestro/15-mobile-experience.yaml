appId: com.davidegea.smartexpenseai
---
# This is the same deep link used by the widget and launcher shortcut.
- openLink: "smartexpenseai://transactions?quickAdd=income"
- extendedWaitUntil:
    visible: "New transaction"
    timeout: 20000
- tapOn: "Amount"
- inputText: "2400.05"
- tapOn: "Merchant"
- inputText: "Native Salary"
- hideKeyboard
- tapOn:
    id: "choice-category"
- scrollUntilVisible:
    element: "New category.*"
    direction: DOWN
    timeout: 10000
- tapOn: "New category.*"
- tapOn: "New category name"
- eraseText: 30
- inputText: "Native Income"
- hideKeyboard
- scrollUntilVisible:
    element: "Payment method"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "date-transaction-date"
- tapOn: "OK"
- tapOn:
    id: "choice-payment-method"
- tapOn: "Bank transfer"
- tapOn: "Description"
- inputText: "Monthly native payroll"
- hideKeyboard
- scrollUntilVisible:
    element: "Recurring transaction"
    direction: DOWN
    timeout: 10000
- tapOn: "Recurring transaction"
- scrollUntilVisible:
    element: "Save transaction"
    direction: DOWN
    timeout: 10000
- tapOn: "Save transaction"
- extendedWaitUntil:
    visible: "Native Salary"
    timeout: 20000
# The long editor can leave Activity's nested scroll positioned over the bottom
# navigation. Remount Activity through its normal deep link before exercising
# search and filters; the transaction has already been persisted locally.
- openLink: "smartexpenseai://transactions"
- extendedWaitUntil:
    visible: "Search transactions"
    timeout: 20000
- extendedWaitUntil:
    visible: "All changes synchronized"
    timeout: 30000
# Search by the merchant that was just observed after save. The later filtered
# card assertion still verifies that the description survived persistence.
- tapOn: "Search transactions"
- inputText: "Native Salary"
- hideKeyboard
- extendedWaitUntil:
    visible: "Native Salary"
    timeout: 20000
- assertNotVisible: "Native Bridge Coffee"
- tapOn: "Filters and sort"
- scrollUntilVisible:
    element: "Transaction type"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "choice-transaction-type"
- tapOn: "Income"
- tapOn:
    id: "choice-recurring"
- tapOn: "Recurring only"
- scrollUntilVisible:
    element: "Sort"
    direction: DOWN
    timeout: 10000
# Use the stable accessibility id for the ChoiceField. Tapping its rendered
# value can resolve the adjacent native date-order control on tall CI devices.
- tapOn:
    id: "choice-sort"
- extendedWaitUntil:
    visible: "Highest amount"
    timeout: 10000
- tapOn: "Highest amount"
- scrollUntilVisible:
    element: "Show transactions"
    direction: DOWN
    timeout: 10000
- tapOn: "Show transactions"
- assertVisible: "Native Salary"
- assertVisible: "Monthly native payroll"
- takeScreenshot: mobile-activity
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Spent this month.*"
    timeout: 30000
- takeScreenshot: mobile-home
- scrollUntilVisible:
    element: "Recent transactions"
    direction: DOWN
    timeout: 15000
- assertVisible: "Native Salary"
- tapOn:
    id: "tab-insights"
- assertVisible: "A clearer view of where your money is going."
- takeScreenshot: mobile-insights
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element: "Account & security"
    direction: DOWN
    timeout: 10000
