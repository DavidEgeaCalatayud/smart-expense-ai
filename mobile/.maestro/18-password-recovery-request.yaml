appId: com.davidegea.smartexpenseai
---
- launchApp
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn: "Forgot password link"
- extendedWaitUntil:
    visible: "Forgot password"
    timeout: 30000
- tapOn: "Recovery email"
- inputText: "native-recovery-e2e@example.com"
- hideKeyboard
- tapOn: "Send recovery email"
- extendedWaitUntil:
    visible: "If an account exists.*"
    timeout: 30000
- tapOn: "Back to sign in"
- assertVisible: "Welcome back"
