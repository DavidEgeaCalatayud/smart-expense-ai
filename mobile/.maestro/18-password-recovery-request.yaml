appId: com.davidegea.smartexpenseai
---
- tapOn: "Forgot your password?"
- assertVisible: "Forgot password"
- tapOn: "Recovery email"
- inputText: "native-recovery-e2e@example.com"
- hideKeyboard
- tapOn: "Send recovery email"
- extendedWaitUntil:
    visible: "If an account exists.*"
    timeout: 30000
- tapOn: "Back to sign in"
- assertVisible: "Welcome back"
