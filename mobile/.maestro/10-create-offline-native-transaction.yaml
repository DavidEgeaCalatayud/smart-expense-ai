appId: com.davidegea.smartexpenseai
---
- launchApp
- extendedWaitUntil:
    visible: "Offline-first transactions"
    timeout: 15000
- scrollUntilVisible:
    element: "Merchant"
    direction: UP
    timeout: 10000
- tapOn: "Merchant"
- inputText: "Native Bridge Coffee"
- hideKeyboard
- tapOn: "Amount"
- inputText: "34.56"
- hideKeyboard
- tapOn: "Save offline"
- extendedWaitUntil:
    visible: "Native Bridge Coffee"
    timeout: 10000
- scrollUntilVisible:
    element: "Native Bridge Coffee"
    direction: DOWN
    timeout: 10000
- assertVisible: "Native Bridge Coffee"
- scrollUntilVisible:
    element: "Pending sync"
    direction: DOWN
    timeout: 10000
- assertVisible: "Pending sync"
