appId: com.davidegea.smartexpenseai
---
- stopApp
- launchApp
- openLink: "smartexpenseai://transactions"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 30000
- scrollUntilVisible:
    element: "All changes synchronized"
    direction: UP
    timeout: 30000
- assertVisible: "All changes synchronized"
- scrollUntilVisible:
    element: "Native Bridge Coffee"
    direction: DOWN
    timeout: 30000
- assertVisible: "Native Bridge Coffee"
- assertVisible: ".*34[.]56 €"
- scrollUntilVisible:
    element: "Synced"
    direction: DOWN
    timeout: 10000
- assertVisible: "Synced"
