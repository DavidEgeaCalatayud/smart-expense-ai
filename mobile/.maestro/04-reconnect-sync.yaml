appId: com.davidegea.smartexpenseai
---
- stopApp
- launchApp
- openLink: "smartexpenseai://transactions"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
- scrollUntilVisible:
    element: "Offline Coffee"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element: "Synced"
    direction: DOWN
    timeout: 30000
# Freeze the V1 replica before the host advances the server to V2. Keep the already-loaded React
# bundle alive: airplane mode isolates FastAPI without forcing a new debug launch that would need
# Metro connectivity.
- setAirplaneMode: enabled
