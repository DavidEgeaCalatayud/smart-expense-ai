appId: com.davidegea.smartexpenseai
---
- launchApp
- assertVisible: "Offline-first transactions"
- tapOn: "Merchant"
- inputText: "Offline Coffee"
- hideKeyboard
- tapOn: "Amount"
- inputText: "12.34"
- hideKeyboard
- tapOn: "Save offline"
- extendedWaitUntil:
    visible: "Offline Coffee"
    timeout: 10000
- scrollUntilVisible:
    element: "Pending sync"
    direction: DOWN
    timeout: 10000
- assertVisible: "Pending sync"
