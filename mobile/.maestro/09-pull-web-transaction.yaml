appId: com.davidegea.smartexpenseai
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
- scrollUntilVisible:
    element: "Web Bridge Coffee"
    direction: DOWN
    timeout: 30000
- assertVisible: "Web Bridge Coffee"
- assertVisible: "23[.]45 €"
- scrollUntilVisible:
    element: "Synced"
    direction: DOWN
    timeout: 10000
- assertVisible: "Synced"
