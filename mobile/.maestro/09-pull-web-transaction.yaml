appId: com.davidegea.smartexpenseai
---
- launchApp
- extendedWaitUntil:
    visible: "Offline-first transactions"
    timeout: 15000
- scrollUntilVisible:
    element: "Sync now"
    direction: UP
    timeout: 10000
- tapOn: "Sync now"
- scrollUntilVisible:
    element: "Web Bridge Coffee"
    direction: DOWN
    timeout: 30000
- assertVisible: "Web Bridge Coffee"
- assertVisible: "23.45"
- scrollUntilVisible:
    element: "Synced"
    direction: DOWN
    timeout: 10000
- assertVisible: "Synced"
