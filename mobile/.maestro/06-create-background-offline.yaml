appId: com.davidegea.smartexpenseai
---
- launchApp
- extendedWaitUntil:
    visible: "Offline-first transactions"
    timeout: 15000
- tapOn: "Merchant"
- inputText: "Background Worker Coffee"
- hideKeyboard
- tapOn: "Amount"
- inputText: "7.89"
- hideKeyboard
- tapOn: "Save offline"
- scrollUntilVisible:
    element: "Background Worker Coffee"
    direction: DOWN
    timeout: 15000
- assertVisible: "Background Worker Coffee"
- scrollUntilVisible:
    element: "Pending sync"
    direction: DOWN
    timeout: 10000
- assertVisible: "Pending sync"
