appId: com.davidegea.smartexpenseai
---
- launchApp
- openLink: "smartexpenseai://transactions"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
- tapOn: "\\+ Add"
- tapOn: "Merchant"
- inputText: "Background Worker Coffee"
- hideKeyboard
- tapOn: "Amount"
- inputText: "7.89"
- hideKeyboard
- scrollUntilVisible:
    element: "Save transaction"
    direction: DOWN
    timeout: 10000
- tapOn: "Save transaction"
- scrollUntilVisible:
    element: "Background Worker Coffee"
    direction: DOWN
    timeout: 15000
- assertVisible: "Background Worker Coffee"
- scrollUntilVisible:
    element: "Pending sync"
    direction: DOWN
    timeout: 10000
- assertVisible: "Pending sync"
