appId: com.davidegea.smartexpenseai
---
- launchApp
- assertVisible: "Offline-first transactions"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn: "Create one"
- tapOn: "Display name"
- inputText: "Mobile E2E Second"
- tapOn: "Email"
- inputText: ${E2E_EMAIL_B}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Submit create account"
- extendedWaitUntil:
    visible: "Offline-first transactions"
    timeout: 20000
- assertVisible: ${E2E_EMAIL_B}
- assertNotVisible: "Server Coffee"
- assertNotVisible: "Background Worker Coffee"
- assertNotVisible: "Conflicts need a decision"
- assertVisible: "No local transactions yet.*"
