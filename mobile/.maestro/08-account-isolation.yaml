appId: com.davidegea.smartexpenseai
---
- launchApp
- assertVisible: "Your transactions"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- tapOn: "Create one"
- tapOn: "Display name"
- inputText: "Mobile E2E Second"
- tapOn: "Email"
- inputText: ${E2E_EMAIL_B}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Submit create account"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 20000
- assertVisible: ${E2E_EMAIL_B}
- extendedWaitUntil:
    visible: "All changes synchronized"
    timeout: 15000
- assertNotVisible: "Conflicts need a decision"
- scrollUntilVisible:
    element: "No transactions yet.*"
    direction: DOWN
    timeout: 15000
- assertVisible: "No transactions yet.*"
