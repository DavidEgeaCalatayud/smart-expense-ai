appId: com.davidegea.smartexpenseai
---
- openLink: "smartexpenseai://imports"
- extendedWaitUntil:
    visible: "Choose CSV file"
    timeout: 20000
- tapOn: "Choose CSV file"
- tapOn:
    text: "Show roots"
    optional: true
- tapOn:
    text: "Downloads"
    optional: true
- scrollUntilVisible:
    element: "smart-expense-native.csv"
    direction: DOWN
    timeout: 15000
- tapOn: "smart-expense-native.csv"
- extendedWaitUntil:
    visible: "Match your statement columns.*"
    timeout: 30000
- scrollUntilVisible:
    element: "Preview import"
    direction: DOWN
    timeout: 20000
- tapOn: "Preview import"
- scrollUntilVisible:
    element: "Import 2 transactions"
    direction: DOWN
    timeout: 30000
- tapOn: "Import 2 transactions"
- extendedWaitUntil:
    visible: "Imported 2 transactions.*"
    timeout: 30000
# The React Native development warning banner overlaps the center of the
# Activity tab on the CI emulator. Tap the unobstructed lower part of the
# persistent tab instead; release builds do not render this banner.
- tapOn:
    point: "25%,97%"
- extendedWaitUntil:
    visible: "Search transactions"
    timeout: 20000
- tapOn: "Search transactions"
- inputText: "CSV Native"
- hideKeyboard
- extendedWaitUntil:
    visible: "CSV Native Groceries"
    timeout: 30000
- assertVisible: "CSV Native Train"
