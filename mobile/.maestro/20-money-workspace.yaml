appId: com.davidegea.smartexpenseai
---
- tapOn:
    id: "tab-mi-dinero"
- extendedWaitUntil:
    visible: "Mi dinero"
    timeout: 20000
- assertVisible: "PATRIMONIO TOTAL"

# Investment platform: catalog selection must normalize the local purpose to investment.
- tapOn: "Cuenta"
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Trade Republic"
- hideKeyboard
- tapOn:
    id: "bank-institution-trade-republic"
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
- tapOn: "Saldo actual"
- inputText: "1000.00"
- hideKeyboard
# Move past the form heading before tapping the submit control. Both currently
# share the text "Añadir cuenta", so tapping while the heading is visible can
# select the non-interactive title instead of the button.
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
- scroll
- tapOn: "Añadir cuenta"
- extendedWaitUntil:
    visible: "1 activas"
    timeout: 15000
- assertVisible: "Trade Republic"
- assertVisible: "Inversión"

# A second independent bank account must coexist with the broker.
- scrollUntilVisible:
    element: "Mi dinero"
    direction: UP
    timeout: 10000
- tapOn: "Cuenta"
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Bankinter"
- hideKeyboard
- tapOn:
    id: "bank-institution-bankinter"
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
- tapOn: "Saldo actual"
- inputText: "200.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
- scroll
- tapOn: "Añadir cuenta"
- extendedWaitUntil:
    visible: "2 activas"
    timeout: 15000
- assertVisible: "Trade Republic"
- assertVisible: "Bankinter"
- assertVisible: "1.200,00 €"

- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
