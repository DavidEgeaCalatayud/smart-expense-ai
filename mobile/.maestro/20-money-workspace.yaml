appId: com.davidegea.smartexpenseai
---
- tapOn:
    id: "tab-mi-dinero"
- extendedWaitUntil:
    visible: "Mi dinero"
    timeout: 20000
- assertVisible: "PATRIMONIO TOTAL"

# Investment platform: catalog selection must normalize the local purpose to investment.
- tapOn: "Cuenta"
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Trade Republic"
- hideKeyboard
- tapOn:
    id: "bank-institution-trade-republic"
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
# Both the field label and TextInput expose "Saldo actual" to accessibility.
# Index 1 is the editable control; index 0 is the non-clickable Text label.
- tapOn:
    text: "Saldo actual"
    index: 1
- inputText: "1000.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
- scroll
- tapOn:
    id: "money-account-submit"
- extendedWaitUntil:
    visible: "1 activas"
    timeout: 15000
- assertVisible: "Trade Republic"
- assertVisible: "Inversión"

# A second independent bank account must coexist with the broker.
# Anchor the scroll on the title-row eyebrow rather than the generic "Mi dinero"
# label: WorkspaceNav also exposes "Mi dinero" lower in the hierarchy, which can
# make Maestro stop before the add-account button is actually visible.
- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- tapOn: "Cuenta"
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Bankinter"
- hideKeyboard
- tapOn:
    id: "bank-institution-bankinter"
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Saldo actual"
    index: 1
- inputText: "200.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
- scroll
- tapOn:
    id: "money-account-submit"
- extendedWaitUntil:
    visible: "2 activas"
    timeout: 15000
- assertVisible: "Trade Republic"
- assertVisible: "Bankinter"
- assertVisible: "1.200,00 €"

- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
