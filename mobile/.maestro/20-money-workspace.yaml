appId: com.davidegea.smartexpenseai
---
- tapOn:
    id: "tab-mi-dinero"
- extendedWaitUntil:
    visible: "Mi dinero"
    timeout: 20000
- assertVisible: "PATRIMONIO TOTAL"

# Investment platform: catalog selection must normalize the local purpose to investment.
- tapOn: "Cuenta"
# Inversiones sits between the patrimonio summary and the account editor. Opening the
# form preserves the current ScrollView offset, so reveal the editor before asserting it.
- scrollUntilVisible:
    element: "Añadir cuenta"
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Trade Republic"
- hideKeyboard
- tapOn:
    id: "bank-institution-trade-republic"
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
# The current React Native accessibility hierarchy exposes the balance field as
# one actionable "Saldo actual" node after the institution selection.
- tapOn: "Saldo actual"
- inputText: "1000.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
- scroll
- tapOn:
    id: "money-account-submit"
- extendedWaitUntil:
    visible: "1 activas"
    timeout: 15000
- assertVisible: "Trade Republic"
- assertVisible: "Inversión"

# A second independent bank account must coexist with the broker.
- scrollUntilVisible:
    element: "PATRIMONIO · OFFLINE-FIRST"
    direction: UP
    timeout: 10000
- tapOn: "Cuenta"
# Inversiones sits between the patrimonio summary and the account editor. Opening the
# form preserves the current ScrollView offset, so reveal the editor before asserting it.
- scrollUntilVisible:
    element: "Añadir cuenta"
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible: "Añadir cuenta"
    timeout: 10000
- scrollUntilVisible:
    element: "Desliza para ver todas las entidades disponibles"
    direction: DOWN
    timeout: 10000
- tapOn: "Buscar banco"
- inputText: "Bankinter"
- hideKeyboard
- tapOn:
    id: "bank-institution-bankinter"
- scrollUntilVisible:
    element: "Saldo actual"
    direction: DOWN
    timeout: 10000
- tapOn: "Saldo actual"
- inputText: "200.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Incluir en patrimonio"
    direction: DOWN
    timeout: 10000
- scroll
- tapOn:
    id: "money-account-submit"

# Saving closes the form at its current scroll offset. Bankinter is visible at
# that offset; scroll upward to prove the existing broker card still coexists
# before resetting the workspace via its stable tab and validating the summary.
- extendedWaitUntil:
    visible: "Bankinter"
    timeout: 15000
- scrollUntilVisible:
    element: "Trade Republic"
    direction: UP
    timeout: 10000
- assertVisible: "Trade Republic"
- tapOn:
    id: "tab-mi-dinero"
- extendedWaitUntil:
    visible: "PATRIMONIO TOTAL"
    timeout: 15000
- extendedWaitUntil:
    visible: "2 activas"
    timeout: 15000
- assertVisible: "1.200,00 €"

# Leave the money workspace in a stable state so the harness can continue into
# the extended account lifecycle and cross-client tests.
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Your transactions"
    timeout: 15000
