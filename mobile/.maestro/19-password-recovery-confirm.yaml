appId: com.davidegea.smartexpenseai
---
- openLink: "smartexpenseai://reset-password?token=${E2E_RESET_TOKEN}"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 30000
- tapOn: "New password"
- inputText: "native-recovery-new-456"
- tapOn: "Confirm new password"
- inputText: "native-recovery-new-456"
- hideKeyboard
- tapOn: "Save new password"
- extendedWaitUntil:
    visible: "Password changed.*"
    timeout: 30000
- tapOn: "Back to sign in"
- openLink: "smartexpenseai://reset-password?token=${E2E_RESET_TOKEN}"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 30000
- tapOn: "New password"
- inputText: "native-recovery-new-456"
- tapOn: "Confirm new password"
- inputText: "native-recovery-new-456"
- hideKeyboard
- tapOn: "Save new password"
- extendedWaitUntil:
    visible: "This reset link is invalid or expired.*"
    timeout: 30000
- tapOn: "Back to sign in"
- assertVisible: "Welcome back"
