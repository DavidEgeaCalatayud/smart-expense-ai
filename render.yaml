# Deployment proposal. Creating these resources incurs Render compute/storage
# charges. Connect the owner's workspace and confirm its quote before applying.
services:
  - type: pserv
    name: smart-expense-api
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    numInstances: 1
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: "off"
    preDeployCommand: python deploy/render_start.py migrate
    dockerCommand: python deploy/render_start.py serve
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-expense-db
          property: connectionString

  - type: web
    name: smart-expense-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: DEPLOYMENT_TARGET
        value: render
      - key: PORT
        value: "10000"
      - key: RENDER_BACKEND_HOST
        fromService:
          name: smart-expense-api
          type: pserv
          property: host

databases:
  - name: smart-expense-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    databaseName: smart_expense_ai
    user: smart_expense_user
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
